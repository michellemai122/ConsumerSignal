name: Refresh data

on:
  schedule:
    # Every day at 11:00 UTC (6-7 AM New York).
    - cron: "0 11 * * *"
  workflow_dispatch:
  # TEMP: test run on this branch before merge; removed in the next commit.
  push:
    branches: [auto-refresh]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      # Each source fails on its own; the script exits 1 only when no source
      # returned data, so a bad day never commits a broken database.
      - name: Run pipeline
        run: python scripts/run_pipeline.py

      - name: Commit refreshed database
        run: |
          if git diff --quiet -- startup_intelligence.db; then
            echo "Database unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startup_intelligence.db
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
